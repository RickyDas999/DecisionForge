[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "decisionforge"
version = "0.0.0"
description = "Local-first multi-agent research and decision intelligence platform (early phases: contracts + model providers)."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "fastapi>=0.110",
    "httpx>=0.27",
]
# Serve the local web UI.
web = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
# Only needed to run the Anthropic provider against the real API.
# Not required for development or the test suite (mock mode is the default).
anthropic = [
    "anthropic>=0.40",
]
# Only needed for the real no-key DuckDuckGo search provider.
# Not required for development or the test suite (mock search is the default).
search = [
    "ddgs>=6.0",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
